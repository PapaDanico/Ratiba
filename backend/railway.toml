[build]
# Self-contained: build context is backend/ only, no repo-root files needed.
dockerfilePath = "Dockerfile.prod"

[deploy]
# alembic.ini is at /app/alembic.ini (WORKDIR in Dockerfile.prod)
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
