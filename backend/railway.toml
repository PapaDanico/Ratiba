[build]
# Build context is the repo root (pyproject.toml + backend/ both needed).
dockerfilePath = "backend/Dockerfile"

[deploy]
# Run migrations then start the server. $PORT is set by Railway.
startCommand = "alembic -c /workspace/backend/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
