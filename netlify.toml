# ═════════════════════════════════════════════════════════════════════════════
# Netlify Configuration — Frontend SPA + API proxy to backend
# ═════════════════════════════════════════════════════════════════════════════

# Build settings
[build]
  # Only build the frontend; backend stays on Render
  base = "frontend"
  # With base=frontend Netlify's default ignore skips builds unless files under
  # frontend/ change — edits to netlify/functions/ or this file never deployed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ../frontend ../netlify ../netlify.toml"
  command = "npm run build"
  publish = "dist"
  functions = "../netlify/functions"

# Disable the no-more-404 plugin: we handle 404s via SPA redirects
[[plugins]]
  package = "netlify-plugin-no-more-404"
  [plugins.inputs]
    on404 = "warn"  # Warn instead of error

# netlify-plugin-fetch-feeds was installed via the Netlify UI with no inputs,
# which hard-fails every build ("Required inputs: dataDir, feeds"). Config
# entries override UI inputs, so this no-op config unbreaks builds. Remove
# this block once the plugin is uninstalled in the Netlify UI
# (Project configuration → Build → Build plugins).
[[plugins]]
  package = "netlify-plugin-fetch-feeds"
  [plugins.inputs]
    dataDir = "netlify-feeds"
    feeds = []

# Environment variables (set these in Netlify UI or via CLI)
[build.environment]
  # Default to Render backend; override in Netlify dashboard if different
  VITE_BACKEND_URL = "https://ratiba-api.onrender.com"

# Redirects and rewrites
# ─────────────────────────────────────────────────────────────────────────────

# 1. API routes: forward to backend (matches /api/*)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-proxy/:splat"
  status = 200
  force = true

# 3. Health check routes
[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/api-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/version"
  to = "/.netlify/functions/api-proxy"
  status = 200
  force = true

# 3. SPA fallback — MUST be last and unconditional. An unforced 200 rewrite
# only applies when no published file matches, so assets still serve
# directly. (A previous version used `conditions = { status = [404] }`,
# which Netlify does not support — the rule never matched and every deep
# link / page refresh returned a 404.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
# ─────────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allow requests from the same origin and CORS if backend is on different domain
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Cache behavior for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
