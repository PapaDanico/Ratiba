# Temporary diagnostic: fetch Netlify deploy/build logs from a runner with
# open egress (the dev sandbox cannot reach api.netlify.com). Safe to delete
# once the deploy-preview failure on PR #50 is diagnosed.
name: netlify-log

on:
  push:
    paths:
      - ".github/workflows/netlify-log.yml"

jobs:
  fetch-log:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Netlify API for deploy log
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          DEPLOY_ID: 6a531c028214f00008270f37
          BUILD_ID: 6a531c028214f00008270f35
        run: |
          set -x
          AUTH=()
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then AUTH=(-H "Authorization: Bearer $NETLIFY_AUTH_TOKEN"); fi
          for url in \
            "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID" \
            "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID/log" \
            "https://api.netlify.com/api/v1/builds/$BUILD_ID" \
            "https://api.netlify.com/api/v1/builds/$BUILD_ID/log" ; do
            echo "===== UNAUTH $url ====="
            curl -sS --max-time 30 "$url" -w "\nHTTP:%{http_code}\n" | tail -c 20000 || true
            echo "===== AUTH $url ====="
            curl -sS --max-time 30 "${AUTH[@]}" "$url" -w "\nHTTP:%{http_code}\n" | tail -c 20000 || true
          done
