name: Branch cleanup (one-shot)

# Deletes the old default branch now that main is the default, then its own
# branch, removing this workflow from the repo.

on:
  push:
    paths:
      - ".github/workflows/branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          for b in claude/kick-off-UF3lY claude/platform-troubleshooting-69xzxq; do
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" || echo "skip $b"
          done
