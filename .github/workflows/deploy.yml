name: Deploy

# Manual dispatch only (backend/infrastructure deploys).
#
# The frontend deploys via Netlify's Git integration: the site
# (ratibacrewmanagement) is linked to this repo, so pushes to main build and
# publish production directly on Netlify (netlify.toml controls the build).
# The previous actions-netlify job here was removed — it required a
# NETLIFY_AUTH_TOKEN secret that Netlify rejects (Unauthorized), which made
# every push-to-main run fail after the site was git-linked and the job
# became redundant.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  # ── Backend: Manual dispatch for Render deployments ────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate environment selection
        run: |
          if [ "${{ inputs.environment }}" != "staging" ] && [ "${{ inputs.environment }}" != "production" ]; then
            echo "Invalid environment: ${{ inputs.environment }}" >&2
            exit 1
          fi

      - name: Deploy to Render
        run: |
          echo "Backend deployment to ${{ inputs.environment }} — manual trigger"
          echo "Render service: ratiba-api"
          echo "Deploy command:"
          echo "  curl -X POST https://api.render.com/deploy/srv-XXXXX?key=YOUR_RENDER_DEPLOY_KEY"
          echo ""
          echo "⚠️  Manual step required:"
          echo "  1. Get deploy key from Render dashboard"
          echo "  2. Add RENDER_DEPLOY_KEY secret to GitHub"
          echo "  3. Push to main or trigger workflow manually"

  # ── Guard: Ensure deploys come from main ────────────────────────────────────
  guard:
    name: Guard (main branch only)
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify on main
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "⚠️  Deployment requires main branch. Current branch: ${{ github.ref }}" >&2
          exit 1
      - name: Deployment info
        run: |
          echo "✅ Deployment triggered from ${{ github.ref }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo ""
          echo "📊 Deployed services:"
          echo "  • Frontend: https://ratiba-*.netlify.app"
          echo "  • Backend: https://ratiba-api.onrender.com"
          echo "  • Database: Neon"
