name: Deploy

# Trigger on:
# 1. Push to main (automatic frontend deploy to Netlify)
# 2. Manual dispatch (for backend/infrastructure deploys)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'netlify/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  # ── Frontend: Automatic deploy to Netlify on push to main ──────────────────
  deploy-frontend:
    name: Deploy Frontend to Netlify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Type check
        working-directory: frontend
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        working-directory: frontend
        run: npm run build

      # API deploys don't read the repo-root netlify.toml, so the SPA fallback
      # and /api proxy rewrites must ship as a _redirects file inside dist.
      - name: Write _redirects for API deploy
        run: |
          cat > frontend/dist/_redirects <<'EOF'
          /api/*    /.netlify/functions/api-proxy/:splat  200!
          /healthz  /.netlify/functions/api-proxy         200!
          /version  /.netlify/functions/api-proxy         200!
          /*        /index.html                           200
          EOF

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2.1.0
        with:
          publish-dir: 'frontend/dist'
          # Without functions-dir the api-proxy function is dropped from the
          # deploy, and without production-deploy this only creates a draft
          # that never reaches ratibacrewmanagement.netlify.app.
          functions-dir: 'netlify/functions'
          production-deploy: ${{ github.ref == 'refs/heads/main' }}
          deploy-message: 'Deploy from GitHub Actions: ${{ github.sha }}'
          netlify-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          site-id: ${{ secrets.NETLIFY_SITE_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          VITE_BACKEND_URL: 'https://ratiba-api.onrender.com'

  # ── Backend: Manual dispatch for Render deployments ────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate environment selection
        run: |
          if [ "${{ inputs.environment }}" != "staging" ] && [ "${{ inputs.environment }}" != "production" ]; then
            echo "Invalid environment: ${{ inputs.environment }}" >&2
            exit 1
          fi

      - name: Deploy to Render
        run: |
          echo "Backend deployment to ${{ inputs.environment }} — manual trigger"
          echo "Render service: ratiba-api"
          echo "Deploy command:"
          echo "  curl -X POST https://api.render.com/deploy/srv-XXXXX?key=YOUR_RENDER_DEPLOY_KEY"
          echo ""
          echo "⚠️  Manual step required:"
          echo "  1. Get deploy key from Render dashboard"
          echo "  2. Add RENDER_DEPLOY_KEY secret to GitHub"
          echo "  3. Push to main or trigger workflow manually"

  # ── Guard: Ensure deploys come from main ────────────────────────────────────
  guard:
    name: Guard (main branch only)
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify on main
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "⚠️  Deployment requires main branch. Current branch: ${{ github.ref }}" >&2
          exit 1
      - name: Deployment info
        run: |
          echo "✅ Deployment triggered from ${{ github.ref }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo ""
          echo "📊 Deployed services:"
          echo "  • Frontend: https://ratiba-*.netlify.app"
          echo "  • Backend: https://ratiba-api.onrender.com"
          echo "  • Database: Neon"
