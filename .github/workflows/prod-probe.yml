# Probes production page routes (the dev sandbox cannot reach netlify.app).
# Retries for up to ~9 min so it can watch a deploy flip 404 -> 200.
name: prod-probe

on:
  push:
    paths:
      - ".github/workflows/prod-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SPA routes and API on production
        run: |
          BASE=https://ratibacrewmanagement.netlify.app
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          ROUTES="/ /login /dashboard /crew /roster /routings /leave /swaps /training /currency /import /irop /me /notices /postings /settings /reports"
          for attempt in $(seq 1 18); do
            fail=0
            out=""
            for r in $ROUTES; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" "$BASE$r")
              out="$out $r=$code"
              [ "$code" = "200" ] || fail=1
            done
            api=$(curl -s -A "$UA" "$BASE/api/v1/health" -w " HTTP:%{http_code}" | tail -c 200)
            echo "attempt $attempt:$out api=[$api]"
            [ "$fail" = "0" ] && { echo "ALL ROUTES 200"; exit 0; }
            sleep 30
          done
          echo "ROUTES STILL FAILING AFTER RETRIES"
          curl -s -D - -o /dev/null -A "$UA" "$BASE/crew" | head -30
          exit 1
