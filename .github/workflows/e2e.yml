name: Production e2e

# Drives the deployed site with a real browser (the dev sandbox has no egress
# to netlify.app, so this runs on a GitHub runner). Read-only: it logs in and
# sweeps every authenticated route, failing on page errors, console errors, or
# any /api/v1 response >= 400. Bump .github/e2e-request.json to re-run.

on:
  push:
    paths:
      - ".github/e2e-request.json"
      - ".github/workflows/e2e.yml"
      - "frontend/tests/e2e/**"
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC — weekly regression sweep
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Route sweep against production
        env:
          E2E_LIVE: "1"
          PLAYWRIGHT_BASE_URL: https://ratibacrewmanagement.netlify.app
          E2E_ADMIN_EMAIL: officer@example.aero
          E2E_ADMIN_PASSWORD: hunter2pass
        run: npx playwright test tests/e2e/route-smoke.spec.ts --reporter=github,html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
