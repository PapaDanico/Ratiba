name: backend-ci

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "backend/**"
      - "bot/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "bot/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ratiba
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: ratiba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ratiba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ratiba:dev_password@localhost:5432/ratiba_test
      TEST_DATABASE_URL: postgresql+psycopg://ratiba:dev_password@localhost:5432/ratiba_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci_test_secret_key_ci_test_secret_key_ci_test_secret
      ANTHROPIC_API_KEY: dummy
      TELEGRAM_BOT_TOKEN: dummy
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: mypy --strict
        run: mypy backend/app bot

      - name: pytest
        run: pytest --cov=backend/app --cov-report=term --cov-report=xml

      - name: Deploy smoke (boot the built app + login round-trip)
        run: |
          set -e
          cd backend
          alembic upgrade head
          PYTHONPATH=. python scripts/seed.py --demo || echo "seed warn (non-fatal)"
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          UVPID=$!
          cd ..
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break || sleep 1
          done
          bash scripts/smoke.sh http://127.0.0.1:8000
          kill "$UVPID" 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore
