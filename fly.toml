# Fly.io Configuration for Ratiba Backend
app = "ratiba-api"
primary_region = "nairobi"  # Closest region to East Africa

[build]
  builder = "docker"
  dockerfile = "Dockerfile"

[env]
  LOG_LEVEL = "info"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.tcp_checks]
    enabled = true
    grace_period = "30s"
    interval = "15s"
    timeout = "2s"

[[vm]]
  memory = "512mb"
  cpus = 1

[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[[statics]]
  guest_path = "/app/public"
  url_prefix = "/public"
