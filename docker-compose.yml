services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ratiba
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: ratiba
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratiba -d ratiba"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ratiba:dev_password@db:5432/ratiba
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./pyproject.toml:/workspace/pyproject.toml:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 3000
    env_file: .env
    environment:
      VITE_BACKEND_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python telegram_bot.py
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./bot:/app
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  frontend_node_modules:
