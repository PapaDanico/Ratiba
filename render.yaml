services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: ratiba-api
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    # Readiness (DB-backed): returns 503 until Postgres is reachable, so Render
    # won't route to an instance that can't serve login. /healthz is liveness.
    healthCheckPath: /readyz
    envVars:
      # Supabase Postgres: configure this as a secret on each backend service.
      # See docs/supabase-backend-configuration.md. TLS (`?sslmode=require`) is required.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ratiba-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Served over HTTPS on Render → mark the session cookies Secure.
      - key: COOKIE_SECURE
        value: "true"
      # CORS allow-origin. Set to the frontend URL after the first deploy:
      #   https://ratiba-app.onrender.com  (or your custom domain)
      # (The app reads FRONTEND_URL; nginx also proxies /api server-side.)
      - key: FRONTEND_URL
        sync: false

  # ── Frontend (nginx + Vite SPA) ────────────────────────────────────────────
  - type: web
    name: ratiba-app
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    healthCheckPath: /
    envVars:
      # Set this to the backend URL after the first deploy:
      #   https://ratiba-api.onrender.com
      - key: BACKEND_URL
        sync: false

  # ── Background worker (rq) ───────────────────────────────────────────────
  # Consumes the job queue (notifications, recurrency digest, roster-publish
  # broadcast). Without this, enqueued jobs would never run in production.
  - type: worker
    name: ratiba-worker
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: ./worker.sh
    plan: free
    envVars:
      # Supabase Postgres: configure this as a secret on each backend service.
      # See docs/supabase-backend-configuration.md. TLS (`?sslmode=require`) is required.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ratiba-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # ── Recurrency digest (scheduled) ────────────────────────────────────────
  # Emails crewing staff a daily summary of lapsing currencies/ratings/docs.
  # Runs the digest in-process per operator (no HTTP/auth needed).
  - type: cron
    name: ratiba-digest
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: ./digest-cron.sh
    schedule: "0 5 * * *"  # 05:00 UTC ≈ 08:00 EAT, daily
    plan: free
    envVars:
      # Supabase Postgres: configure this as a secret on each backend service.
      # See docs/supabase-backend-configuration.md. TLS (`?sslmode=require`) is required.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # ── Keep-warm cron (prevent cold-start spindown) ──────────────────────────
  # Free-tier Render spins down inactive services. This pings /healthz every 10 min
  # to keep ratiba-api warm and responsive. Set API_URL to prod after first deploy.
  - type: cron
    name: ratiba-keepwarm
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: ./keepwarm-cron.sh
    schedule: "*/10 * * * *"  # Every 10 minutes
    plan: free
    envVars:
      - key: API_URL
        value: ""  # ← MANUAL STEP: Set to https://ratiba-api.onrender.com after first deploy (sync: false)
        sync: false

  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: ratiba-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all
