services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: ratiba-api
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    # Readiness (DB-backed): returns 503 until Postgres is reachable, so Render
    # won't route to an instance that can't serve login. /healthz is liveness.
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ratiba-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ratiba-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Served over HTTPS on Render → mark the session cookies Secure.
      - key: COOKIE_SECURE
        value: "true"
      # CORS allow-origin. Set to the frontend URL after the first deploy:
      #   https://ratiba-app.onrender.com  (or your custom domain)
      # (The app reads FRONTEND_URL; nginx also proxies /api server-side.)
      - key: FRONTEND_URL
        sync: false

  # ── Frontend (nginx + Vite SPA) ────────────────────────────────────────────
  - type: web
    name: ratiba-app
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    healthCheckPath: /
    envVars:
      # Set this to the backend URL after the first deploy:
      #   https://ratiba-api.onrender.com
      - key: BACKEND_URL
        sync: false

  # ── Background worker (rq) ───────────────────────────────────────────────
  # Consumes the job queue (notifications, recurrency digest, roster-publish
  # broadcast). Without this, enqueued jobs would never run in production.
  - type: worker
    name: ratiba-worker
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: ./worker.sh
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ratiba-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ratiba-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # ── Recurrency digest (scheduled) ────────────────────────────────────────
  # Emails crewing staff a daily summary of lapsing currencies/ratings/docs.
  # Runs the digest in-process per operator (no HTTP/auth needed).
  - type: cron
    name: ratiba-digest
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: ./digest-cron.sh
    schedule: "0 5 * * *"  # 05:00 UTC ≈ 08:00 EAT, daily
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ratiba-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # ── Keep-warm ping ───────────────────────────────────────────────────────
  # Pings the public /healthz every 10 min so the free-tier ratiba-api web
  # service doesn't spin down (and cold-start 502 on a user's first request).
  # Set API_URL to https://ratiba-api.onrender.com after the first deploy.
  - type: cron
    name: ratiba-keepwarm
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: ./keepwarm-cron.sh
    schedule: "*/10 * * * *"  # every 10 minutes (under the ~15 min idle spindown)
    plan: free
    envVars:
      - key: API_URL
        sync: false

  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: ratiba-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all

databases:
  # ── Postgres ───────────────────────────────────────────────────────────────
  - name: ratiba-db
    databaseName: ratiba
    user: ratiba
    plan: free
