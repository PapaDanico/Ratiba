[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ratiba-backend"
version = "0.1.0"
description = "Ratiba — AI-anchored crew rostering platform (backend)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "DN Consultancy" },
]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "rq>=2.0",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "ortools>=9.11",
    "anthropic>=0.40",
    "weasyprint>=63.0",
    "httpx>=0.27",
    "python-telegram-bot>=21.6",
    "sentry-sdk[fastapi]>=2.18",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "freezegun>=1.5",
    "types-python-jose",
    "types-passlib",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

# -----------------------------------------------------------------------------
# Ruff — linter + formatter
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "bot"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",          # line length handled by formatter
    "RUF001",        # ambiguous chars in strings (we deliberately use ≤ ≥ × etc.)
    "RUF002",        # ambiguous chars in docstrings
    "RUF003",        # ambiguous chars in comments
]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*" = ["E402", "F401"]
"backend/tests/**/*" = ["B011"]
# FastAPI's idiomatic `Depends(...)` in default args is the right pattern here.
"backend/app/api/**/*" = ["B008"]
"backend/app/core/dependencies.py" = ["B008"]

# -----------------------------------------------------------------------------
# mypy --strict
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = false  # Phase 0 stubs don't import every override target yet
warn_return_any = true
show_error_codes = true
show_error_context = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "backend:."
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "ortools.*",
    "weasyprint.*",
    "rq.*",
    "passlib.*",
    "redis.*",
    "fakeredis.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "backend.alembic.versions.*"
ignore_errors = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: marks tests as integration tests requiring services",
    "slow: marks tests as slow",
]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
